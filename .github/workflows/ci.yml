name: AuraVoice CI Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  backend-test:
    name: Backend Tests & Benchmarks (Go)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: services/api/go.sum

      - name: Verify Go Format & Vet
        run: |
          cd services/api
          go vet ./...

      - name: Run Backend Unit & Safety Tests
        run: |
          cd services/api
          go test -v -race ./...

      - name: Run Matchmaking Benchmark Tests
        run: |
          cd services/api
          go test -v -bench=. ./internal/matchmaking

  frontend-build:
    name: Frontend Build & Type Check (Next.js)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/web/package.json

      - name: Install Frontend Dependencies
        run: |
          cd apps/web
          npm install

      - name: Build Next.js Production Bundle
        run: |
          cd apps/web
          npm run build

  docker-lint:
    name: Docker Configuration Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Config
        run: |
          cd infra/docker
          docker compose config
